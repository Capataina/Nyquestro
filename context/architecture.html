  "glossary": [
    {
      "term": "LOB",
      "def": "Limit Order Book - the two sorted lists (bids, asks) of resting orders the engine maintains and matches against."
    },
    {
      "term": "Price-time priority",
      "def": "The matching rule: best price wins; among orders at the same price, the earliest-arrived (FIFO) wins."
    },
    {
      "term": "Aggressor / resting",
      "def": "The aggressor is the incoming order that crosses the spread; resting orders are those already sitting in the book waiting to be matched."
    },
    {
      "term": "Partial fill",
      "def": "An incoming order matching across multiple resting orders until filled or no more crossing liquidity exists; remaining quantity is tracked at each step."
    },
    {
      "term": "Self-match",
      "def": "An order trading against itself (same OrderID on both sides). Nyquestro rejects the aggressor wholly at match time and double-checks in FillEvent::new."
    },
    {
      "term": "Microprice",
      "def": "A volume-weighted mid: (bid_qty*ask_px + ask_qty*bid_px)/(bid_qty+ask_qty). A better fair-value estimate than the simple mid when the book is imbalanced."
    },
    {
      "term": "OFI",
      "def": "Order-Flow Imbalance - the relative weight of bid-side vs ask-side depth, used as a directional pressure signal."
    },
    {
      "term": "Spread / depth / touch",
      "def": "Spread = best ask - best bid; depth = resting quantity near the top; the touch is the best price on a side."
    },
    {
      "term": "OU process",
      "def": "Ornstein-Uhlenbeck - a mean-reverting stochastic walk dX = theta*(mu - X)*dt + sigma*sqrt(dt)*N(0,1), used for the synthetic fair-value mid."
    },
    {
      "term": "HDR histogram",
      "def": "High Dynamic Range histogram - records the full latency distribution so p50/p99/p99.9/p99.99 are exact, not estimated from an average."
    },
    {
      "term": "p99 / tail latency",
      "def": "The 99th-percentile latency. The tail (p99/p99.9), not the average, is what matters for a matching engine; one slow order in a thousand can be catastrophic."
    },
    {
      "term": "Determinism",
      "def": "Same input sequence -> byte-identical output. Achieved via integer prices, caller-supplied timestamps, and never calling the clock inside matching. Enables replay."
    },
    {
      "term": "L2 / level2",
      "def": "Market-data depth feed giving per-price-level aggregate quantity (vs L1 top-of-book or L3 per-order). Coinbase ships L2; the bridge fakes per-order from it."
    },
    {
      "term": "Tick",
      "def": "The minimum price increment (1 cent here). Also: a sim tick (50ms flow step) or render tick (33ms draw) in the dashboard loop."
    },
    {
      "term": "Slab / intrusive list",
      "def": "Future hot-path structures (plans/medium-wins.md): a slab pool recycles order nodes without malloc; an intrusive list makes cancel-by-id O(1)."
    },
    {
      "term": "Single-writer sharding",
      "def": "The planned concurrency model: one thread owns each book, threads communicate via lock-free rings (LMAX Disruptor style), scaling by independent shards not locks."
    }
  ],
  "decisions": [
    {
      "title": "Integer cents, never floats, for price",
      "why": "Px(u64) in cents makes matching exact and deterministic and kills float-comparison bugs; from_dollars rounds to nearest cent, fixing the historical truncation bug where $10.999 rounded down to 1099 instead of the correct 1100.",
      "node": "types"
    },
    {
      "title": "checked_sub only - saturating_sub is not exposed",
      "why": "saturating_sub flooring an underflow at zero was the source of the silent over-fill bug; refusing to expose it forces every caller to handle underflow explicitly.",
      "node": "order"
    },
    {
      "title": "Caller-supplied timestamps; matching never calls Ts::now()",
      "why": "Fills reuse the resting order's timestamp so the same input sequence is byte-identical on replay - the determinism contract pinned by matching_test.rs.",
      "node": "book"
    },
    {
      "title": "Self-match rejected at match time, aggressor wholly",
      "why": "The aggressor is rejected and the resting counterparty untouched; FillEvent::new re-checks as defence in depth so an externally-composed book still cannot self-match.",
      "node": "book"
    },
    {
      "title": "Single-threaded engine + sim + renderer",
      "why": "Sufficient for observability, avoids every concurrency hazard, and is the correct single-writer core to later shard rather than lock. The README's lock-free ambition is deferred.",
      "node": "ui"
    },
    {
      "title": "Bounded telemetry channel, drop-on-full",
      "why": "try_send + AtomicU64 drop counter means a slow disk can never block the single-threaded engine; lost events are counted, not silently ignored.",
      "node": "telemetry"
    },
    {
      "title": "Coinbase snapshot capped at 50 levels/side",
      "why": "Coinbase ships 25k+ levels on connect; SNAPSHOT_LEVEL_CAP truncates to the closest-to-touch 50/side at the parse boundary to protect the engine from the firehose.",
      "node": "feed"
    },
    {
      "title": "OU step dt clamped to min(1/theta, 0.25)",
      "why": "Explicit Euler diverges once theta*dt >= 2; an uncapped wall-clock*speed dt at a frame hitch diverged the mid to near-u64::MAX and overflowed the sparkline (ceed2e9). The cap keeps theta*dt <= 1 and bounds the Poisson burst.",
      "node": "simulator"
    },
    {
      "title": "Render-loop panic hook restores the terminal",
      "why": "A panic inside terminal.draw used to leave the user on a raw-mode alternate screen with an unreadable backtrace; install_panic_hook restores cooked mode then chains to the default hook (7525618).",
      "node": "ui"
    }
  ],

  const SVGNS = "http://www.w3.org/2000/svg";
  const LAYER_GAP = 252, ROW_GAP = 118;
  const POS_KEY = "arch.graph.pos.v2";

  let stage, svg, root, gEdges, gFlow, gNodes;
  let allNodes = [], allEdges = [], allById = {};
  let nodes = [], edges = [], byId = {};
  let collapsed = new Set();
  let posOverride = {};
  let view = { x: 0, y: 0, k: 1 };
  let selected = null, hovered = null, selEdge = null;

  let impactMode = false;
  let raf = null, flowTimer = null;

  function el(tag, a) { const e = document.createElementNS(SVGNS, tag); if (a) for (const k in a) e.setAttribute(k, a[k]); return e; }

  /* ---------- visible set (collapse groups) ---------- */
  function computeVisible() {
    const hidden = new Set();

    nodes = allNodes.filter(n => !hidden.has(n.id));
    byId = {}; nodes.forEach(n => byId[n.id] = n);
    const map = id => (hidden.has(id) ? allById[id].group : id);
    const seen = new Set(); edges = [];
    allEdges.forEach(e => {
      const a = map(e.from), b = map(e.to);
      if (a === b) return;
      const key = a + ">" + b;
      if (seen.has(key)) { // keep strongest rel on merge
        const ex = edges.find(x => x.from === a && x.to === b);
        if (ex && rank(e.rel) > rank(ex.rel)) { ex.rel = e.rel; ex.label = e.label; }

  /* ---------- layout ---------- */
  function computeLayers() {

    const ord = id => byId[id] ? byId[id]._ord : 0;
    for (let p = 0; p < 5; p++) keys.forEach(L => {
      groups[L].forEach(n => {
        const nb = edges.filter(e => e.from === n.id || e.to === n.id)
          .map(e => e.from === n.id ? e.to : e.from).filter(id => byId[id] && Math.abs(layer[id] - L) === 1);

    const layer = computeLayers(), groups = groupByLayer(layer);

  }
  function radialLayout() {
    const layer = computeLayers(), groups = groupByLayer(layer);

  /* ---------- build DOM ---------- */
  function buildEdges() {
    edges.forEach(e => {
      const p = el("path", { class: "edge rel-" + e.rel, "marker-end": "url(#ar-" + e.rel + ")" });
      e._p = p; gEdges.append(p);
      const f = el("path", { class: "edge-flow rel-" + e.rel }); e._f = f; gFlow.append(f);
      const hit = el("path", { class: "edge-hit", fill: "none", stroke: "transparent", "stroke-width": 16 });

  }
  function buildNodes() {
    nodes.forEach((n, i) => {
      const w = n.w, h = n.h;
      const g = el("g", { class: "node", style: `--kc: var(--k-${n.kind})` });
      g.dataset.id = n.id;
      g.style.animationDelay = (i * 34) + "ms";
      g.classList.add("node-enter");
      g.addEventListener("animationend", function onEnd(ev) {

      });

      const glow = el("rect", { class: "node-glow", x: -w / 2, y: -h / 2, width: w, height: h, rx: 11, fill: "none", stroke: `var(--k-${n.kind})`, "stroke-width": 2 });
      const box = el("rect", { class: "node-box", x: -w / 2, y: -h / 2, width: w, height: h, rx: 11, fill: "var(--bg-elevated)", stroke: `var(--k-${n.kind})`, "stroke-width": 1.4 });
      const dot = el("circle", { class: "node-dot", cx: -w / 2 + 16, cy: 0, r: 3.5 + Math.min(n._deg, 8) * 0.42, fill: `var(--k-${n.kind})` });
      const label = el("text", { class: "node-label", x: -w / 2 + 28, y: -1, "text-anchor": "start", "font-size": 13, fill: "var(--tx)", "dominant-baseline": "middle" });
      label.textContent = n.label;
      const sub = el("text", { class: "node-sub", x: -w / 2 + 28, y: 12, "text-anchor": "start", "font-size": 8.5, fill: "var(--tx-3)", "dominant-baseline": "middle", "letter-spacing": ".04em" });
      sub.textContent = n.root.replace("src/", "").replace(/\/$/, "").replace(".rs", "") || "entry";
      g.append(pulse, glow, box, dot, label, sub);

      // collapse/expand control for group parents

        const kids = groupChildren(n.id).length;
        const isC = collapsed.has(n.id);
        const ctrl = el("g", { class: "node-ctrl" });
        const cx = w / 2 - 13;
        ctrl.append(el("circle", { cx, cy: -h / 2 + 13, r: 8, fill: "#0b0d12", stroke: `var(--k-${n.kind})`, "stroke-width": 1.2 }));
        const ct = el("text", { x: cx, y: -h / 2 + 13, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 9, fill: `var(--k-${n.kind})`, "font-family": "var(--mono)" });
        ct.textContent = isC ? "+" + kids : "–";
        ctrl.append(ct);
        ctrl.addEventListener("mousedown", ev => ev.stopPropagation());

            `<b>${n.label}</b><span class="tip-rel" style="color:var(--k-${n.kind});background:color-mix(in oklab, var(--k-${n.kind}), transparent 86%)">${n.kind}</span>` +
            `<span class="tip-row"><i>root</i><em>${n.root || "-"}</em></span>` +
            `<span class="tip-row"><i>depends on</i><em>${outs}</em></span>` +
            `<span class="tip-row"><i>consumed by</i><em>${ins}</em></span>`);

  function edgePath(e) {

  /* ---------- highlight / paint ---------- */
  function neighborSet(id) { const s = new Set([id]); edges.forEach(e => { if (e.from === id) s.add(e.to); if (e.to === id) s.add(e.from); }); return s; }

      e._p.classList.toggle("hot", inPath); e._p.classList.toggle("dim", !inPath); e._p.classList.remove("sel");
      e._f.classList.toggle("run", inPath);

    }
    rebuild();
    if (selChanged && opts.onSelect) opts.onSelect(selected);
  }

  /* ---------- drag / pan / zoom ---------- */
  function clientToWorld(cx, cy) { const r = stage.getBoundingClientRect(); return { x: (cx - r.left - view.x) / view.k, y: (cy - r.top - view.y) / view.k }; }
  function startNodeDrag(ev, n) {
    ev.stopPropagation();
    const start = clientToWorld(ev.clientX, ev.clientY);
    const ox = n.x - start.x, oy = n.y - start.y; n._dragging = true; let moved = false;
    function move(e) { const w = clientToWorld(e.clientX, e.clientY); n.x = w.x + ox; n.y = w.y + oy; moved = true; renderPositions(); }
    function up() {
      n._dragging = false;
      window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
      if (!moved) select(n.id);
      else { posOverride[n.id] = { x: n.x, y: n.y }; savePositions(); }
    }
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  }
  function savePositions() { try { localStorage.setItem(POS_KEY, JSON.stringify(posOverride)); } catch (e) {} }
  function loadPositions() { try { posOverride = JSON.parse(localStorage.getItem(POS_KEY)) || {}; } catch (e) { posOverride = {}; } }
  function resetPositions() { posOverride = {}; savePositions(); setMode(mode); }

  function initPanZoom() {
    let panning = false, sx, sy, vx, vy;
    stage.addEventListener("mousedown", e => {
      if (e.target.closest(".node") || e.target.closest(".edge-hit")) return;
      panning = true; stage.classList.add("panning"); sx = e.clientX; sy = e.clientY; vx = view.x; vy = view.y;
      deselect();
    });
    window.addEventListener("mousemove", e => { if (!panning) return; view.x = vx + (e.clientX - sx); view.y = vy + (e.clientY - sy); applyView(); });
    window.addEventListener("mouseup", () => { panning = false; stage.classList.remove("panning"); });
    stage.addEventListener("wheel", e => {
      e.preventDefault();
      const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const nk = Math.max(0.3, Math.min(2.6, view.k * (1 - e.deltaY * 0.0015)));
      const wx = (mx - view.x) / view.k, wy = (my - view.y) / view.k;
      view.k = nk; view.x = mx - wx * nk; view.y = my - wy * nk; applyView();
    }, { passive: false });
  }

  function bbox() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    nodes.forEach(n => { x0 = Math.min(x0, n.x - n.w / 2); y0 = Math.min(y0, n.y - n.h / 2); x1 = Math.max(x1, n.x + n.w / 2); y1 = Math.max(y1, n.y + n.h / 2); });
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }
  function fit(animate) {
    const r = stage.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return;
    const b = bbox(), pad = Math.max(28, Math.min(72, r.width * 0.07));
    const k = Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h, 1.35);
    const tx = (r.width - b.w * k) / 2 - b.x0 * k, ty = (r.height - b.h * k) / 2 - b.y0 * k;
    if (animate) animateView(tx, ty, k); else { view = { x: tx, y: ty, k }; applyView(); }
  }
  function centerOn(n) { const r = stage.getBoundingClientRect(); animateView(r.width * 0.42 - n.x * view.k, r.height / 2 - n.y * view.k, view.k); }
  function animateView(tx, ty, tk) {
    const s = { ...view }, t0 = performance.now(), dur = 460; cancelAnimationFrame(raf);
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      view.x = s.x + (tx - s.x) * e; view.y = s.y + (ty - s.y) * e; view.k = s.k + (tk - s.k) * e; applyView();
      if (p < 1) raf = requestAnimationFrame(step);
    })(performance.now());
  }
  function zoomBy(f) {
    const r = stage.getBoundingClientRect(), mx = r.width / 2, my = r.height / 2;
    const nk = Math.max(0.3, Math.min(2.6, view.k * f)), wx = (mx - view.x) / view.k, wy = (my - view.y) / view.k;
    view.k = nk; view.x = mx - wx * nk; view.y = my - wy * nk; applyView();
  }

  /* ---------- minimap ---------- */
  let mm, mmView, mmReady = false;
  function buildMinimap() {
    mm = document.getElementById("minimapSvg"); if (!mm) return;
    mm.replaceChildren();
    edges.forEach(e => { const l = el("line", { stroke: "rgba(255,255,255,0.14)", "stroke-width": 2.5 }); e._mml = l; mm.append(l); });
    nodes.forEach(n => { const c = el("rect", { rx: 8, fill: `var(--k-${n.kind})`, opacity: .85 }); n._mm = c; mm.append(c); });
    mmView = el("rect", { class: "mm-view" }); mm.append(mmView);
    mmReady = true; updateMinimapGeom();
    mm.style.cursor = "crosshair";
    mm.onclick = e => {
      const r = mm.getBoundingClientRect(), vb = mm.viewBox.baseVal;
      if (!r.width || !vb.width) return;
      const wx = vb.x + (e.clientX - r.left) / r.width * vb.width;
      const wy = vb.y + (e.clientY - r.top) / r.height * vb.height;
      const sr = stage.getBoundingClientRect();
      animateView(sr.width / 2 - wx * view.k, sr.height / 2 - wy * view.k, view.k);
    };
  }
  function updateMinimapGeom() {
    if (!mmReady) return;
    const b = bbox(), pad = 34;
    mm.setAttribute("viewBox", `${b.x0 - pad} ${b.y0 - pad} ${b.w + pad * 2} ${b.h + pad * 2}`);
    edges.forEach(e => { const s = byId[e.from], t = byId[e.to]; if (!s || !t || !e._mml) return; e._mml.setAttribute("x1", s.x); e._mml.setAttribute("y1", s.y); e._mml.setAttribute("x2", t.x); e._mml.setAttribute("y2", t.y); });
    nodes.forEach(n => { if (!n._mm) return; n._mm.setAttribute("x", n.x - n.w / 2); n._mm.setAttribute("y", n.y - n.h / 2); n._mm.setAttribute("width", n.w); n._mm.setAttribute("height", n.h); });
  }
  function drawMinimap() {
    if (!mmReady) return;
    const r = stage.getBoundingClientRect();
    mmView.setAttribute("x", -view.x / view.k); mmView.setAttribute("y", -view.y / view.k);
    mmView.setAttribute("width", r.width / view.k); mmView.setAttribute("height", r.height / view.k);
  }

  /* ---------- tick-flow animation ---------- */
  function flowNodes(ids, o) {
    o = o || {}; stopFlow();
    const seq = ids.filter(id => byId[id]);
    if (!seq.length) return;
    let i = 0;
    function step() {
      nodes.forEach(n => n._g.classList.remove("flow-on"));
      edges.forEach(e => e._f.classList.remove("run", "flow-edge"));
      const id = seq[i], n = byId[id];
      if (n) n._g.classList.add("flow-on");
      if (i > 0) { const e = edges.find(e => e.from === seq[i - 1] && e.to === id) || edges.find(e => e.from === id && e.to === seq[i - 1]); if (e) { e._f.classList.add("run", "flow-edge"); } }
      if (opts.onFlowStep) opts.onFlowStep(i, id);
      i++;
      if (i < seq.length) flowTimer = setTimeout(step, o.interval || 420);
      else if (o.loop) { i = 0; flowTimer = setTimeout(step, 650); }
      else flowTimer = setTimeout(() => { stopFlow(); if (opts.onFlowEnd) opts.onFlowEnd(); }, 560);
    }
    fit(true); step();
  }
  function stopFlow() {
    clearTimeout(flowTimer); flowTimer = null;
    nodes.forEach(n => n._g && n._g.classList.remove("flow-on"));
    edges.forEach(e => e._f && e._f.classList.remove("run", "flow-edge"));
    if (!hovered && !selected && !selEdge) clearPaint();
  }
  function isFlowing() { return !!flowTimer; }

  /* ---------- external highlight (entity linking) ---------- */
  function highlight(ids) {
    const set = new Set(ids);
    nodes.forEach(n => n._g.classList.toggle("ext-hot", set.has(n.id)));
    nodes.forEach(n => n._g.classList.toggle("dim", set.size > 0 && !set.has(n.id)));
  }
  function clearHighlight() {
    nodes.forEach(n => n._g.classList.remove("ext-hot"));
    paint();
  }

  /* ---------- ego mini-graph (dossier) ---------- */
  function renderEgo(svgEl, id) {
    const center = allById[id]; if (!center) return;
    const outs = allEdges.filter(e => e.from === id).map(e => ({ id: e.to, dir: "out", rel: e.rel }));
    const ins = allEdges.filter(e => e.to === id).map(e => ({ id: e.from, dir: "in", rel: e.rel }));
    const all = [...ins, ...outs];
    const W = 300, H = 150, cx = W / 2, cy = H / 2;
    svgEl.setAttribute("viewBox", `0 0 ${W} ${H}`);
    let s = "";
    const place = [];
    const n = all.length || 1;
    all.forEach((nb, i) => {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = 56;
      place.push({ ...nb, x: cx + Math.cos(ang) * r * 1.7, y: cy + Math.sin(ang) * r });
    });
    place.forEach(p => {
      const col = { dep: "rgba(255,255,255,0.25)", strong: "var(--cyan)", write: "var(--violet)", peer: "var(--amber)" }[p.rel];
      const x1 = p.dir === "out" ? cx : p.x, y1 = p.dir === "out" ? cy : p.y;
      const x2 = p.dir === "out" ? p.x : cx, y2 = p.dir === "out" ? p.y : cy;
      const bend = (y1 + y2) / 2 + (x2 > x1 ? 9 : -9);
      s += `<path d="M ${x1} ${y1} Q ${(x1 + x2) / 2} ${bend}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="1.4" ${p.rel === "write" || p.rel === "peer" ? 'stroke-dasharray="3 3"' : ""}/>`;
    });
    place.forEach(p => {
      const k = allById[p.id].kind;
      s += `<g class="ego-node" data-ego="${p.id}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="6" fill="var(--k-${k})"/>` +
        `<text x="${p.x}" y="${p.y + 17}" text-anchor="middle" font-size="9.5" fill="var(--tx-2)" font-family="var(--mono)">${p.id.length > 12 ? p.id.slice(0, 11) + "…" : p.id}</text></g>`;
    });
    s += `<g><rect x="${cx - 36}" y="${cy - 15}" width="72" height="30" rx="9" fill="var(--bg-elevated)" stroke="var(--k-${center.kind})" stroke-width="1.5"/>` +
      `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="var(--tx)" font-family="var(--mono)">${center.label}</text></g>`;
    svgEl.innerHTML = s;
    svgEl.querySelectorAll(".ego-node").forEach(g => g.addEventListener("click", () => selectExternal(g.dataset.ego)));
  }

  /* ---------- rebuild ---------- */
  function rebuild(relayout) {
    computeVisible();
    gEdges.replaceChildren(); gFlow.replaceChildren(); gNodes.replaceChildren();
    buildEdges(); buildNodes(); buildMinimap();
    doLayout();
    renderPositions();
    if (relayout !== false) fit(true);
    paint(); syncExplorer();
  }
  function doLayout() { if (mode === "force") forceLayout(); else if (mode === "radial") radialLayout(); else layeredLayout(); }

  function setMode(m) {
    mode = m;
    document.querySelectorAll("[data-graph-mode]").forEach(b => b.classList.toggle("active", b.dataset.graphMode === m));
    if (m === "force") forceLayout();
    else { doLayout(); renderPositions(); fit(true); }
  }
  function setImpact(on) {
    impactMode = on;
    document.querySelectorAll("[data-impact-toggle]").forEach(b => b.classList.toggle("active", on));
    paint();
    if (!on && opts.onImpact) opts.onImpact(null);
    else if (on && selected && opts.onImpact) paintImpact(selected);
  }

  function init(stageEl, o) {
    stage = stageEl; opts = o || {};
    /* Default x/y to the origin before the spread: the minimap and edge
       geometry build once before the first layout pass, and undefined
       coordinates there emit an SVG attribute warning per element. */
    allNodes = ARCH.nodes.map(n => ({ x: 0, y: 0, ...n }));
    allEdges = ARCH.edges.map(e => ({ ...e }));
    allById = {}; allNodes.forEach(n => allById[n.id] = n);
    const deg = {}; allNodes.forEach(n => deg[n.id] = 0);
    allEdges.forEach(e => { deg[e.from]++; deg[e.to]++; });
    allNodes.forEach(n => { n._deg = deg[n.id]; const d = Math.min(deg[n.id], 8); n.w = Math.max(120 + d * 5, 46 + n.label.length * 8.6); n.h = 50 + d * 1.7; });
    loadPositions();

    svg = el("svg");
    const defs = el("defs");
    [["dep", "rgba(255,255,255,0.3)"], ["strong", "var(--cyan)"], ["write", "var(--violet)"], ["peer", "var(--amber)"]].forEach(([k, c]) => {
      const m = el("marker", { id: "ar-" + k, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" });
      m.append(el("path", { d: "M0 0 L10 5 L0 10 z", fill: c })); defs.append(m);
    });
    svg.append(defs);
    root = el("g", { id: "graphRoot" });
    gEdges = el("g"); gFlow = el("g"); gNodes = el("g"); root.append(gEdges, gFlow, gNodes);
    svg.append(root); stage.append(svg);

    computeVisible(); buildEdges(); buildNodes(); buildMinimap();
    layeredLayout(); renderPositions(); initPanZoom();
    requestAnimationFrame(() => fit(false));

    let rt = null, lastW = 0, lastH = 0;
    new ResizeObserver(() => {
      const r = stage.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return;
      if (Math.abs(r.width - lastW) < 2 && Math.abs(r.height - lastH) < 2) return;
      lastW = r.width; lastH = r.height; clearTimeout(rt); rt = setTimeout(() => fit(true), 90);
    }).observe(stage);

    return {
      setMode, fit: () => fit(true), zoomIn: () => zoomBy(1.2), zoomOut: () => zoomBy(1 / 1.2),
      select: selectExternal, deselect, arrange: () => { resetPositions(); }, getSelected: () => selected,
      toggleGroup, setImpact, isImpact: () => impactMode,
      flowNodes, stopFlow, isFlowing,
      highlight, clearHighlight, renderEgo, resetPositions,
      selectEdge: (f, t) => { const e = edges.find(x => x.from === f && x.to === t) || edges.find(x => x.from === t && x.to === f); if (e) selectEdge(e); },
      hasNode: (id) => !!byId[id],
    };
  }

  return { init };
})();

</script>
<script>
/* ============================================================
   features.js — cross-cutting systems
   global search/command palette · entity linking · markdown
   source · state persistence · keyboard nav
   ============================================================ */
(function () {
  const A = window.ARCH;
  window.App = window.App || {};
  const App = window.App;
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => window.App.esc(s);

  /* ================= GLOBAL SEARCH / COMMAND PALETTE ================= */
  function buildIndex() {
    const idx = [];
    A.nodes.forEach(n => idx.push({ kind: "subsystem", label: n.label, sub: n.tagline, icon: "◉", color: `var(--k-${n.kind})`, run: () => App.selectNode(n.id) }));
    const secs = [
      ["Scope / Purpose", "source", "scope"], ["Repository Overview", "source", "overview"], ["Milestones", "source", "milestones"], ["Repository Tree", "source", "tree"],
      ["Data Flow", "flow", "flow"], ["Failure Semantics", "flow", "failures"], ["Critical Paths", "paths", "paths"],
      ...((A.bespoke || []).map(b => [b.title, "paths", "bespoke-" + b.id])),
      ["Dependency Layers", "deps", "layers"], ["Inter-System Relations", "deps", "relations"], ["Adjacency Matrix", "deps", "matrix"],
      ["State Ownership", "deps", "state"], ["Coverage", "cov", "cov"], ["Concept Map", "concept", "concept"], ["Structural Notes", "concept", "notes"],
    ];
    secs.forEach(([l, t, a]) => idx.push({ kind: "section", label: l, sub: "section · " + t, icon: "▸", color: "var(--tx-3)", run: () => App.openAnchor(t, a) }));
    A.glossary.forEach(g => idx.push({ kind: "term", label: g.term, sub: g.def, icon: "✦", color: "var(--cyan)", run: () => App.openAnchor("concept", "concept") }));
    A.risks.forEach(r => idx.push({ kind: "risk", label: r.title, sub: "risk · " + r.node, icon: "▲", color: "var(--red)", run: () => App.selectNode(r.node) }));
    A.decisions.forEach(d => idx.push({ kind: "decision", label: d.title, sub: "decision", icon: "◆", color: "var(--cyan)", run: () => App.selectNode(d.node) }));
    A.dataFlow.steps.forEach(s => idx.push({ kind: "step", label: `${String(s.n).padStart(2, "0")} ${s.fn}`, sub: "data-flow step · " + s.sys, icon: "↯", color: "var(--tx-3)", run: () => { App.openAnchor("flow", "flow"); setTimeout(() => App.flashStep(s.n), 350); } }));
    // commands
    idx.push({ kind: "cmd", label: "Play data flow on graph", sub: "command", icon: "▶", color: "var(--cyan)", run: () => { App.switchTab("graph"); App.graph().flowNodes(A.dataFlow.steps.map(s => s.sys.split("::")[0]).filter((x, i, a) => x !== a[i - 1]), { interval: 560 }); } });
    idx.push({ kind: "cmd", label: "Toggle blast-radius mode", sub: "command", icon: "⊛", color: "var(--cyan)", run: () => { App.switchTab("graph"); App.graph().setImpact(!App.graph().isImpact()); } });
    idx.push({ kind: "cmd", label: "View raw markdown source", sub: "command", icon: "⟨⟩", color: "var(--cyan)", run: () => { if (App.setMd) App.setMd(true); } });
    if (window.CALLGRAPH) {
      idx.push({ kind: "view", label: "Call Graph", sub: "static call graph · ego + hierarchy", icon: "⌁", color: "var(--cyan)", run: () => App.switchTab("calls") });
      (CALLGRAPH.nodes || []).forEach(nd => {
        if (nd.ext) return;
        idx.push({ kind: "fn", label: nd.name, sub: "call graph · " + (nd.meta || ""), icon: "ƒ", color: "var(--violet)", run: () => { App.switchTab("calls"); if (App.cgFocus) App.cgFocus(nd.id); } });
      });
    }
    return idx;
  }
  let INDEX = null;

  function initSearch() {
    const inp = $("#search"), box = $("#searchResults");
    let active = -1, results = [];
    function render(q) {
      if (!INDEX) INDEX = buildIndex();
      q = q.trim().toLowerCase();
      if (!q) { results = INDEX.slice(0, 8); }
      else results = INDEX.map(it => ({ it, s: score(it, q) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 12).map(x => x.it);
      const KORDER = ["view", "subsystem", "fn", "section", "step", "term", "risk", "decision", "cmd"];
      results.sort((a, b) => KORDER.indexOf(a.kind) - KORDER.indexOf(b.kind));
      active = results.length ? 0 : -1;
      let html = "", lastKind = null;
      results.forEach((r, i) => {
        if (r.kind !== lastKind) { html += `<div class="sr-group">${esc(r.kind)}</div>`; lastKind = r.kind; }
        html += `
        <div class="sr-item ${i === active ? "active" : ""}" data-i="${i}">
          <span class="sr-icon" style="color:${r.color}">${r.icon}</span>
          <span class="sr-main"><span class="sr-label">${esc(r.label)}</span><span class="sr-sub">${esc(r.sub.slice(0, 70))}</span></span>
          <span class="sr-kind">${esc(r.kind)}</span>
        </div>`;
      });
      box.innerHTML = results.length ? html : `<div class="sr-empty">No matches for “${esc(q)}”</div>`;
      box.classList.add("open");
      box.querySelectorAll(".sr-item").forEach(el => {
        el.addEventListener("mousedown", e => { e.preventDefault(); choose(+el.dataset.i); });
        el.addEventListener("mouseenter", () => { active = +el.dataset.i; hl(); });
      });
    }
    function score(it, q) {
      const l = it.label.toLowerCase(), s = (it.sub || "").toLowerCase();
      if (l === q) return 100;
      if (l.startsWith(q)) return 60;
      if (l.includes(q)) return 40;
      if (s.includes(q)) return 15;
      return 0;
    }
    function hl() { box.querySelectorAll(".sr-item").forEach((el, i) => el.classList.toggle("active", i === active)); }
    function choose(i) { const r = results[i]; if (r) { r.run(); close(); inp.blur(); } }
    function close() { box.classList.remove("open"); box.innerHTML = ""; }
    inp.addEventListener("input", () => render(inp.value));
    inp.addEventListener("focus", () => render(inp.value));
    inp.addEventListener("blur", () => setTimeout(close, 120));
    inp.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(results.length - 1, active + 1); hl(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); hl(); }
      else if (e.key === "Enter") { e.preventDefault(); choose(active); }
      else if (e.key === "Escape") { close(); inp.blur(); }
    });
    document.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); inp.focus(); inp.select(); render(inp.value); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); const wb = document.querySelector("#workbench"); if (App.setNavCollapsed) App.setNavCollapsed(!wb.classList.contains("nav-collapsed")); }
    });
  }

  /* ================= UNIVERSAL ENTITY LINKING ================= */
  function initEntity() {
    const labelFor = id => { const n = (A.nodes || []).find(x => x.id === id); return n ? n.label : id; };
    function cssEsc(s) { return String(s).replace(/"/g, '\\"'); }
    function lit(name, on, x, y) {
      $$(`.ent[data-entity="${cssEsc(name)}"]`).forEach(el => el.classList.toggle("entity-lit", on));
      const owner = App.ENTITY[name];
      const g = App.graph && App.graph();
      if (on) {
        // on-tab feedback: name the owning subsystem (works on any tab, not just the graph)
        if (owner && window.__tip) window.__tip.show(x, y, `<b>${esc(name)}</b><span style="color:var(--tx-3)">state owned by </span><span style="color:var(--cyan)">${esc(labelFor(owner))}</span>`);
        if (owner && g && g.hasNode(owner)) g.highlight([owner]);
      } else {
        if (window.__tip) window.__tip.hide();
        if (g) g.clearHighlight();
      }
    }
    document.addEventListener("mouseover", e => { const t = e.target.closest(".ent[data-entity]"); if (t) lit(t.dataset.entity, true, e.clientX, e.clientY); });
    document.addEventListener("mousemove", e => { const t = e.target.closest(".ent[data-entity]"); if (t && window.__tip) window.__tip.move(e.clientX, e.clientY); });
    document.addEventListener("mouseout", e => { const t = e.target.closest(".ent[data-entity]"); if (t) lit(t.dataset.entity, false); });
    document.addEventListener("click", e => { const t = e.target.closest(".ent[data-entity]"); if (t) { const owner = App.ENTITY[t.dataset.entity]; const g = App.graph && App.graph(); if (owner && g && g.hasNode(owner)) g.select(owner); } });
  }

  /* ================= MARKDOWN SOURCE ================= */
  function mdTable(headers, rows) {
    return `| ${headers.join(" | ")} |\n| ${headers.map(() => "---").join(" | ")} |\n` +
      rows.map(r => `| ${r.map(c => String(c).replace(/\|/g, "\\|").replace(/\n/g, " ")).join(" | ")} |`).join("\n");
  }
  const MD = {
    graph() {
      let s = `## Subsystem Map\n\n`;
      A.nodes.forEach(n => { s += `### ${n.label}  \`${n.root}\`\n${n.tagline}\n\n- **Owns:** ${n.owns}\n`; const o = A.edges.filter(e => e.from === n.id).map(e => `${e.to} (${e.rel})`); const i = A.edges.filter(e => e.to === n.id).map(e => `${e.from} (${e.rel})`); if (o.length) s += `- **Depends on / writes:** ${o.join(", ")}\n`; if (i.length) s += `- **Consumed by:** ${i.join(", ")}\n`; s += `\n`; });
      return s;
    },
    flow() {
      let s = `## Core Execution / Data Flow\n\n${A.dataFlow.intro}\n\nSimSet order: ${A.dataFlow.simsets.join(" → ")}\n\n`;
      A.dataFlow.steps.forEach(st => { s += `${String(st.n).padStart(2, "0")}. **${st.sys}::${st.fn}** \`${st.set}\`${st.fail ? " ⚠" : ""}\n    - reads: ${st.reads}\n    - writes: ${st.writes}\n`; });
      s += `\n### Failure Semantics\n\n`; A.failures.forEach(f => s += `- **${f.link} · ${f.title}** — ${f.body}\n`);
      return s;
    },
    deps() {
      let s = `## Dependency Direction\n\n`;
      A.layers.forEach((l, i) => s += `${i + 1}. **${l.name}** — ${l.role}\n`);
      s += `\n> ${A.layersNote}\n\n## Inter-System Relationships\n\n` + mdTable(["A", "B", "Mechanism", "Data", "Breaks if violated"], A.relationships.map(r => [r.a, r.b, r.mech, r.data, r.breaks]));
      s += `\n\n## State Ownership\n\n`; A.stateOwnership.forEach(o => s += `- **${o.owner}** — ${o.items}\n`);
      return s;
    },
    cov() {
      let s = `## Coverage\n\n${A.coverage.note}\n\n`;
      s += mdTable(["Module", ...A.coverage.cols], A.coverage.rows.map(r => [r.label, ...A.coverage.cols.map(c => r.cells[c] || "·")]));
      return s;
    },
    paths() {
      let s = `## Critical Paths & Blast Radius\n\n`;
      A.criticalPaths.forEach(p => s += `### ${p.name} (${p.len})\n${p.steps.join(" → ")}\n\n${p.blast}\n\n`);
      (A.bespoke || []).forEach(b => { s += `### ${b.title}\n${b.subtitle || ""}\n\n`; (b.steps || []).forEach(st => s += `- **${st.id}${st.sys ? " " + st.sys : ""}** - ${st.body}\n`); s += `\n`; });
      return s;
    },
    concept() {
      let s = `## Concept Map — ${A.concept.root}\n\n`;
      A.concept.branches.forEach(b => { s += `### ${b.head}\n` + b.leaves.map(l => `- ${l}`).join("\n") + "\n" + b.trunks.map(t => `- ${t}`).join("\n") + "\n\n"; });
      s += `> ${A.concept.note}\n\n## Structural Notes\n\n`; A.notes.forEach(n => s += `- **[${n.tag}] ${n.title}** — ${n.body}\n`);
      return s;
    },
    calls() {
      const C = window.CALLGRAPH;
      if (!C || !C.nodes || !C.nodes.length) return `## Call Graph\n\n_No call-graph data generated for this repository yet._\n`;
      let s = `## Call Graph\n\n${C.scope}\n\n`;
      s += mdTable(["metric", "value", "share"], (C.stats || []).map(t => [t[0], t[1], t[3] || ""]));
      s += `\n\n### Functions (full inventory)\n\n` + mdTable(["function", "site", "in", "out"], (C.fns || []).map(f => [f.name, `${f.file}:${f.line}`, f.in, f.out]));
      s += `\n\n### Call edges (view spine)\n\n`; (C.edges || []).forEach(e => s += `- ${e[0]} → ${e[1]} (${e[2]})\n`);
      return s;
    },
    source() {
      const p = A.project;
      let s = `# ${p.name}\n\n${p.tagline}\n\n> ${p.purpose}\n\n## Tech stack\n` + p.techStack.map(t => `- ${t.name} (${t.meta})`).join("\n");
      s += `\n\n## Roadmap\n` + A.milestones.map(m => `- **${m.id} ${m.title}** [${m.status}] — ${m.note}`).join("\n");
      s += `\n\n## Repository\n` + treeMd(A.repoTree, 0);
      return s;
    },
  };
  function treeMd(n, d) { let s = `${"  ".repeat(d)}- ${n.name}${n.anno ? ` — ${n.anno}` : ""}\n`; (n.children || []).forEach(c => s += treeMd(c, d + 1)); return s; }
  App.markdownFor = tab => `<!-- generated from arch/data.js (view: ${tab}) -->\n\n` + ((MD[tab] && MD[tab]()) || "");

  /* ================= PERSISTENCE ================= */
  const KEY = "arch.state.v5";
  let restoring = false;
  function persist() {
    if (restoring) return;
    const wb = $("#workbench");
    const st = {
      tab: App.curTab(), node: App.graph() ? App.graph().getSelected() : null,
      nav: wb.classList.contains("nav-collapsed"),
    };
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
    const h = "#" + st.tab + (st.node ? "/" + st.node : "");
    if (location.hash !== h) history.replaceState(null, "", h);
  }
  App.persist = persist;
  function restore() {
    restoring = true;
    let st = {};
    try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (hash) { const [t, n] = hash.split("/"); if (t) st.tab = t; if (n) st.node = n; else if (hash.indexOf("/") < 0) st.node = null; }
    if (st.nav) App.setNavCollapsed(true);
    if (st.node && App.graph().hasNode(st.node)) App.graph().select(st.node);
    if (st.tab && App.tabs.some(t => t.id === st.tab)) App.switchTab(st.tab);
    restoring = false;
    persist();
  }

  /* ================= KEYBOARD NAV ================= */
  function initKeys() {
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Escape") { App.graph().stopFlow(); App.graph().deselect(); $("#searchResults").classList.remove("open"); }
      else if (/^[0-9]$/.test(e.key)) { const t = App.tabs[e.key === "0" ? 9 : +e.key - 1]; if (t) App.switchTab(t.id); }
    });
  }

  App.initFeatures = function () {
    initSearch(); initEntity(); initKeys();
    requestAnimationFrame(() => requestAnimationFrame(restore));
  };
})();

</script>
<script>
/* ============================================================
   App shell — explorer, tabs, content panes, right rail
   v3 — interactive everywhere
   ============================================================ */
(function () {
  const A = window.ARCH;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const escAttr = s => esc(s).replace(/"/g, "&quot;");
  let graph = null;

  /* ---- derived indexes ---- */
  const nodeById = {}; A.nodes.forEach(n => nodeById[n.id] = n);
  const riskByNode = {}; A.risks.forEach(r => (riskByNode[r.node] = riskByNode[r.node] || []).push(r));
  const hotspotByNode = {}; A.changeFrontier.forEach(c => { hotspotByNode[c.node] = Math.max(hotspotByNode[c.node] || 0, Math.max(...c.bars)); });
  // entity -> owner node (for universal hover linking).
  // The tracked-entity set is derived at runtime from A.nodes[].state and
  // A.stateOwnership[]. No hardcoded project-specific identifiers.
  const ENTITY = {};
  const TRACKED = [];
  function normNode(name) {
    if (!name) return null;
    const lc = String(name).toLowerCase();
    for (const n of A.nodes) {
      if (lc === n.id || lc === (n.label || "").toLowerCase()) return n.id;
    }
    for (const n of A.nodes) {
      if (lc.includes(n.id) || (n.label && lc.includes(n.label.toLowerCase()))) return n.id;
    }
    return null;
  }
  // Entity dictionary keyed by lowercase phrase → owner node. Captures BOTH
  // CamelCase identifiers AND prose phrases ("tonal standards"), so projects
  // that describe state in prose still get live state-links — not just CamelCase.
  function addEntity(raw, owner) {
    const key = String(raw).trim().split(" (")[0].split(".")[0].trim();
    if (key.length < 3 || /\d{4}/.test(key)) return;
    const lk = key.toLowerCase();
    if (!ENTITY[lk]) { ENTITY[lk] = owner; TRACKED.push(lk); }
  }
  (A.stateOwnership || []).forEach(s => {
    const owner = normNode(s.owner);
    if (owner && s.items) String(s.items).split(/[,;]\s*/).forEach(raw => addEntity(raw, owner));
  });
  (A.nodes || []).forEach(n => (n.state || []).forEach(st => addEntity(st, n.id)));
  TRACKED.sort((a, b) => b.length - a.length); // longest first so phrases beat substrings
  const ENT_RE = TRACKED.length
    ? new RegExp("\\b(" + TRACKED.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "gi")
    : null;
  window.App = window.App || {};
  window.App.ENTITY = ENTITY;
  function linkifyStates(str) {
    const out = esc(str);
    if (!ENT_RE) return out;
    // single-pass replace avoids nesting a shorter match inside an already-wrapped span
    return out.replace(ENT_RE, m => `<span class="ent" data-entity="${m.toLowerCase().replace(/"/g, "")}">${m}</span>`);
  }
  function downstreamNodes(id) {
    const seen = new Set([id]); let fr = [id];
    while (fr.length) { const nx = []; fr.forEach(u => A.edges.forEach(e => { if (e.from === u && e.rel !== "peer" && !seen.has(e.to)) { seen.add(e.to); nx.push(e.to); } })); fr = nx; }
    seen.delete(id); return [...seen];
  }
  function daysSince(d) { return Math.round((Date.now() - new Date(d).getTime()) / 86400000); }
  const fmtNum = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const tipRow = (k, v) => `<span class="tip-row"><i>${k}</i><em>${v}</em></span>`;

  /* path step label -> node id (for tracing on graph).
     Derived at runtime from A.dataFlow.steps[].sys mapping plus the optional
     A.dataFlow.pathMap override for projects that want custom routing. */
  const PATHMAP = (function () {
    const m = {};
    (A.dataFlow && A.dataFlow.steps || []).forEach(s => {
      const sys = String(s.sys || "").split("::")[0];
      if (sys && nodeById[sys]) m[sys] = sys;
    });
    Object.assign(m, (A.dataFlow && A.dataFlow.pathMap) || {});
    return m;
  })();
  function pathNodeSeq(steps) {
    const ids = (steps || []).map(s => PATHMAP[s] || (nodeById[s] ? s : null)).filter(Boolean);
    return ids.filter((id, i) => id !== ids[i - 1]); // collapse repeats
  }
  // Resolve a path's tokens to graph nodes, then trace them — or, when the steps
  // aren't subsystems (e.g. script names), give visible feedback instead of the
  // old silent no-op. Stepping is snappy (~420ms).
  function traceable(steps) { return pathNodeSeq(steps).length >= 2; }
  function traceOnGraph(steps) {
    switchTab("graph");
    const seq = pathNodeSeq(steps);
    if (seq.length < 2) {
      const h = $("#graphHint");
      if (h) {
        h.innerHTML = `<span style="color:var(--amber)">These steps aren't subsystems on the topology graph — nothing to trace.</span>`;
        setTimeout(() => { if (h && !graph.isFlowing()) h.textContent = "drag to pan · scroll to zoom · click node to inspect"; }, 2400);
      }
      return false;
    }
    graph.flowNodes(seq, { interval: 420 });
    return true;
  }

  /* ---------------- tab registry ---------------- */
  const TABS = [
    { id: "overview", label: "Overview", ti: "⌂" },
    { id: "graph", label: "Graph", ti: "◉", badge: A.nodes.length + " nodes" },
    { id: "calls", label: "Call Graph", ti: "⌁", badge: (() => { const cg = window.CALLGRAPH || A.callgraph; return cg && cg.nodes && cg.nodes.length ? cg.nodes.filter(n => !n.ext).length + " fn" : null; })() },
    { id: "flow", label: "Data Flow", ti: "↯", badge: ((A.dataFlow && A.dataFlow.steps) || []).length },
    { id: "deps", label: "Dependencies", ti: "⇄", badge: A.relationships.length },
    { id: "cov", label: "Coverage", ti: "▦" },
    { id: "paths", label: "Paths", ti: "⌥", badge: A.criticalPaths.length },
    { id: "concept", label: "Concept", ti: "✦" },
    { id: "source", label: "Source", ti: "#" },
    { id: "lineage", label: "Lineage Arc", ti: "❡", badge: (A.lineage && A.lineage.total) || 0 },
  ];

  /* ---------------- top bar (slim — one nav toggle, search, view mode) ---------------- */
  function renderTopbar() {
    const stale = daysSince(A.project.regenerated);
    const freshClass = stale > 30 ? "stale" : "fresh";
    $("#topbar").innerHTML = `
      <button class="tb-icon on" id="navToggle" data-tip="${escAttr("Collapse navigation (⌘B)")}">☰</button>
      <div class="tb-brand"><div class="tb-logo"></div>
        <div class="tb-crumb"><span class="proj">${esc(A.project.name)}</span><span class="sep">/</span><span class="file">${esc(A.project.file ? A.project.file.split("/").pop() : "architecture.html")}</span></div>
      </div>
      <div class="tb-spacer"></div>
      <div class="tb-search-wrap">
        <div class="tb-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" placeholder="Search subsystems, sections, risks…" autocomplete="off" />
          <kbd>⌘K</kbd>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="tb-spacer"></div>
      <div class="tb-fresh ${freshClass}" data-tip="${escAttr("architecture.md regenerated " + stale + " days ago (" + A.project.regenerated + ").")}">
        <span class="fresh-dot"></span>${stale}d
      </div>
      <div class="tb-meta">HEAD <b>${esc(A.project.head)}</b></div>
      <div class="tb-viewmode" id="viewMode" data-tip="${escAttr("Switch between the rendered explorer and the raw architecture.md markdown that backs the current view")}">
        <button class="vm-btn active" data-vm="rendered">Rendered</button>
        <button class="vm-btn" data-vm="source">Source</button>
      </div>`;
  }

  /* ---------------- primary navigation (single rail: views + subsystems) ----------------
     Consolidates what used to be TWO navigations — the left "Explorer" drawer and the
     workspace tab strip — into one rail. Top group = the views; below = the subsystem
     index. This is the only place to switch context, so there is no redundant tab bar. */
  function renderNav() {
    const NAV_GROUPS = [
      ["Explore", ["overview", "graph", "calls"]],
      ["Analyse", ["flow", "deps", "cov", "paths", "concept"]],
      ["History", ["lineage", "source"]],
    ];
    const navItem = t => {
      const ki = TABS.indexOf(t);
      const key = ki < 0 ? "" : (ki === 9 ? "0" : String(ki + 1));
      return `
      <button class="nav-item" data-tab="${t.id}" data-tip="${escAttr(t.label)}">
        <span class="nav-ico">${t.ti}</span><span class="nav-lbl">${esc(t.label)}</span>
        ${t.badge != null ? `<span class="nav-badge">${esc(t.badge)}</span>` : ""}
        <span class="nav-key">${key}</span>
      </button>`;
    };
    const views = NAV_GROUPS.map(([label, ids]) =>
      `<div class="nav-grouplbl">${label}</div>` +
      ids.map(id => navItem(TABS.find(t => t.id === id))).join("")
    ).join("");
    const subs = A.nodes.map(n => `
      <button class="nav-sub" data-node="${n.id}" data-kind="${n.kind}" style="--kc: var(--k-${n.kind})" data-search="${esc(n.label)} ${esc(n.kind)}" data-tip="${escAttr(nodeById[n.id].tagline)}">
        <span class="nav-sw" style="background:var(--k-${n.kind})"></span><span class="nav-lbl">${esc(n.label)}</span>
        <span class="nav-flags">${(hotspotByNode[n.id] || 0) >= 60 ? '<span class="flag-hot" title="recent change hotspot">●</span>' : ""}${(riskByNode[n.id] || []).length ? '<span class="flag-risk" title="has risk">▲</span>' : ""}</span>
      </button>`).join("");
    $("#nav").innerHTML = `
      <div class="nav-group">${views}</div>
      <div class="nav-sep"></div>
      <div class="nav-subhead"><span>Subsystems</span><span class="nav-subcount">${A.nodes.length}</span></div>
      <div class="nav-subs" id="navSubs">${subs}</div>`;
    $$("#nav .nav-item").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
    $$("#nav .nav-sub").forEach(b => b.addEventListener("click", () => { switchTab("graph"); graph.select(b.dataset.node); }));
  }

  function scrollToAnchor(id) {
    const el = document.getElementById("a-" + id);
    if (!el) return;
    const view = el.closest(".ws-view");
    requestAnimationFrame(() => {
      view.scrollTo({ top: el.offsetTop - 20, behavior: "smooth" });
      el.classList.remove("pulse-anchor"); void el.offsetWidth; el.classList.add("pulse-anchor");
      setTimeout(() => el.classList.remove("pulse-anchor"), 1200);
    });
  }
  function openAnchor(tab, anchor) { switchTab(tab); if (anchor) scrollToAnchor(anchor); }

  /* ---------------- view host (containers only — the nav is the tab strip) ---------------- */
  function renderTabs() {
    $("#wsBody").innerHTML = TABS.map(t => `<div class="ws-view ${t.id === "graph" ? "graph-view" : ""}" data-view="${t.id}"></div>`).join("") +
      `<div class="ws-view md-view" data-view="__md"><div class="doc"><pre class="md-pre" id="mdPre"></pre></div></div>`;
    renderOverview(); renderGraphTab(); renderCallsTab(); renderFlowTab(); renderDepsTab(); renderCovTab();
    renderPathsTab(); renderConceptTab(); renderSourceTab(); renderLineageTab();
  }

  let curTab = "overview", mdMode = false;
  function switchTab(id, opt) {
    if (id !== "__md") curTab = id;
    if (!(opt && opt.keepMd)) mdMode = false;
    $$("#nav .nav-item").forEach(b => b.classList.toggle("active", b.dataset.tab === curTab));
    $$("#nav .nav-sub").forEach(b => b.classList.remove("active"));
    const show = mdMode ? "__md" : curTab;
    $$(".ws-view").forEach(v => v.classList.toggle("active", v.dataset.view === show));
    $$("#viewMode .vm-btn").forEach(b => b.classList.toggle("active", (b.dataset.vm === "source") === mdMode));
    if (curTab === "graph" && !mdMode && graph) requestAnimationFrame(() => graph.fit());
    const sv = $("#sbView");
    if (sv) { const tt = TABS.find(t => t.id === curTab); sv.innerHTML = `view · <b>${tt ? esc(tt.label) : esc(curTab)}</b>`; }
    if (window.App.persist) window.App.persist();
  }
  function setMd(on) {
    if (mdMode === on) return;
    mdMode = on;
    if (mdMode) $("#mdPre").textContent = (window.App.markdownFor ? window.App.markdownFor(curTab) : "");
    switchTab(curTab, { keepMd: true });
  }

  /* ---------- GRAPH tab ---------- */
  function renderGraphTab() {
    $('[data-view="graph"]').innerHTML = `
      <div class="ws-toolbar">
        <div class="tool-group">
          <button class="tool-btn active" data-graph-mode="layered"><span class="ti">≡</span>Layered</button>
          <button class="tool-btn" data-graph-mode="force"><span class="ti">✦</span>Force</button>
          <button class="tool-btn" data-graph-mode="radial"><span class="ti">◎</span>Radial</button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" data-impact-toggle id="gImpact" data-tip="${escAttr("Blast-radius mode: select a node to highlight everything that transitively depends on it.")}"><span class="ti">⊛</span>Impact</button>
          <button class="tool-btn" id="gPlay"><span class="ti">▶</span><span id="playLabel">Play tick</span></button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" id="gFit"><span class="ti">⤢</span>Fit</button>
          <button class="tool-btn" id="gArrange" data-tip="${escAttr("Reset layout + cleared dragged positions")}"><span class="ti">↻</span>Reset</button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" id="gZoomOut">−</button>
          <span class="zoom-val" id="zoomVal">100%</span>
          <button class="tool-btn" id="gZoomIn">+</button>
        </div>
        <div class="ws-hint" id="graphHint">drag to pan · scroll to zoom · click node to inspect</div>
      </div>
      <div class="graph-stage" id="graphStage"></div>
      ${graphLegend()}
      <div class="graph-minimap"><svg id="minimapSvg"></svg></div>`;
  }
  function graphLegend() {
    const kinds = Object.entries(A.kindMeta);
    return `<div class="graph-legend collapsed" id="graphLegend">
      <div class="gl-head"><span class="gl-title">Legend</span><span class="gl-toggle">show ▴</span></div>
      <div class="gl-body">
        <div><div class="gl-col-title">Subsystem role</div>
          ${kinds.map(([k, m]) => `<div class="gl-row"><span class="sw" style="background:var(--k-${k})"></span>${esc(m.label)}</div>`).join("")}</div>
        <div><div class="gl-col-title">Edge type</div>
          <div class="gl-row"><span class="ln" style="border-top:2px solid rgba(255,255,255,0.3)"></span>dependency</div>
          <div class="gl-row"><span class="ln" style="border-top:2px solid var(--cyan)"></span>load-bearing</div>
          <div class="gl-row"><span class="ln" style="border-top:2px dashed var(--violet)"></span>write-back</div>
          <div class="gl-row"><span class="ln" style="border-top:2px dashed var(--amber)"></span>hidden coupling</div></div>
      </div></div>`;
  }

  /* ---------- CALL GRAPH tab ----------
     Ego-explorer over the static call graph: callers | focus | callees with
     certainty-labelled edges, the types the focus touches, and a hierarchy
     tree from the entry point. Data arrives from the call-graph analyser as
     window.CALLGRAPH (a bundled callgraph.js loaded before this file) or as
     ARCH.callgraph; when neither exists the view renders an explanatory
     empty state instead. */
  const CALLGRAPH = window.CALLGRAPH || (A && A.callgraph) || null;
  let cgFocusId = null;
  function drawCgEdges() {
    if (!CALLGRAPH) return;
    const stage = $("#cgStage"), svg = $("#cgSvg");
    if (!stage || !svg) return;

    const nodeOrder = {};

        const cls = rel === "strong" ? "strong" : (rel === "write" ? "wr" : rel === "peer" ? "pe" : "on");
        const ch = rel === "peer" ? "↔" : "→";
        const relLbl = { dep: "dependency", strong: "load-bearing", write: "write-back", peer: "hidden coupling" }[rel] || rel;
        const mTip = `<b>${esc(r)} → ${esc(c)}</b><span class="tip-rel rel-${rel}">${relLbl}</span>` + esc((A.edges.find(e => e.from === r && e.to === c) || {}).label || "");
        return `<td class="${cls}" data-row="${ri}" data-col="${ci}" data-from="${r}" data-to="${c}" data-tip="${escAttr(mTip)}">${ch}</td>`;
      }).join("")}</tr>`).join("")}
      </tbody></table></div>`;
  }
  function wireMatrix() {
    const tbl = $("#adjMatrix"); if (!tbl) return;
    tbl.querySelectorAll("td[data-from]").forEach(td => {
      td.addEventListener("mouseenter", () => {
        tbl.querySelectorAll(`[data-row="${td.dataset.row}"]`).forEach(x => x.classList.add("mx-hl"));
        tbl.querySelectorAll(`[data-col="${td.dataset.col}"]`).forEach(x => x.classList.add("mx-hl"));
      });
      td.addEventListener("mouseleave", () => tbl.querySelectorAll(".mx-hl").forEach(x => x.classList.remove("mx-hl")));
      td.addEventListener("click", () => { switchTab("graph"); graph.selectEdge(td.dataset.from, td.dataset.to); });
    });
  }
  function wireRelTable() {
    const inp = $("#relSearch");
    if (inp) inp.addEventListener("input", () => {
      const q = inp.value.trim().toLowerCase();
      $$('#relTable tbody tr').forEach(tr => tr.style.display = (!q || tr.dataset.hay.includes(q)) ? "" : "none");
    });
    $$('#relTable tbody tr').forEach(tr => tr.addEventListener("click", () => {
      const a = tr.dataset.a, b = tr.dataset.b;
      if (a && b && graph.hasNode(a) && graph.hasNode(b)) { switchTab("graph"); graph.selectEdge(a, b); }

    }));
